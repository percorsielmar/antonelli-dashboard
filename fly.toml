app = "pascale-dashboard"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/data"
  SOLAX_SN = "SKJDTC36XX"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "pascale_data"
  destination = "/data"
